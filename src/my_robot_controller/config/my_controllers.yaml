# ROS 2 Control manager declares available controllers and their types.
controller_manager:
  ros__parameters:
    update_rate: 30            # Hz: how often controllers update in simulated time
    use_sim_time: true         # Ensure controllers follow Gazebo clock

    # Controller names here must match the names you spawn later.
    diff_cont:
      type: diff_drive_controller/DiffDriveController

    # Keep this name if your spawner uses "joint_broad"
    joint_broad:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

# Differential drive controller parameters.
diff_cont:
  ros__parameters:
    use_sim_time: true

    # Wheel joint names must match your URDF/xacro.
    left_wheel_names: ["front_left_joint", "rear_left_joint"]
    right_wheel_names: ["front_right_joint", "rear_right_joint"]

    # Geometry. Adjust if your URDF numbers differ.
    wheel_separation: 1.05
    wheel_radius: 0.15

    # Skid-steer compensation for 4-wheel robots (reduce if turning is too slow).
    wheel_separation_multiplier: 1.2  # Réduit pour skid-steer (était 1.8 - trop!)
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    # Odometry + TF: REQUIRED for Nav2. Publishes odom->base_link continuously.
    publish_rate: 50.0                 # Hz odom pub
    odom_frame_id: odom
    base_frame_id: base_link           # Change if your base is base_footprint
    enable_odom_tf: true               # Turn on odom->base_link TF
    enable_odometry_out: true          # Also publish nav_msgs/Odometry on /odom
    open_loop: false                   # Use wheel feedback from Gazebo (preferred)

    # Covariances help AMCL fuse odom sensibly.
    pose_covariance_diagonal: [0.1, 0.1, 1.0, 1.0, 1.0, 0.5]  # Augmenté: moins de confiance en odom
    twist_covariance_diagonal: [0.1, 0.1, 1.0, 1.0, 1.0, 0.5]  # Augmenté: moins de confiance

    # Velocity input. Unstamped Twist if you relay from Nav2.
    use_stamped_vel: false
    cmd_vel_timeout: 0.5               # Stop if no cmd in 0.5s
    velocity_rolling_window_size: 2    # Smooth noisy velocity feedback

    # Safety limits to prevent jumps/teleportation. Tune to your robot.
    linear:
      x:
        has_velocity_limits: true
        max_velocity: 1.0
        min_velocity: -1.0
        has_acceleration_limits: true
        max_acceleration: 1.0
    angular:
      z:
        has_velocity_limits: true
        max_velocity: 1.0
        min_velocity: -1.0
        has_acceleration_limits: true
        max_acceleration: 1.0

# Arm trajectory controller (position-controlled).
arm_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - shoulder_joint
      - elbow_joint
      - gripper_rotate_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_period: 0.02    # 50 Hz
    action_monitor_rate: 10.0

# Gripper trajectory controller (position-controlled).
gripper_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - gripper_left_joint
      - gripper_right_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity