# =============================================================================
# SLAM Toolbox Parameters for Hybrid Sensor System
# =============================================================================
# Configuration optimized for ultrasonic-based SLAM
# Uses aggregated ultrasonic scan instead of LIDAR
# =============================================================================

slam_toolbox:
  ros__parameters:
    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /ultrasonic_scan    # Use aggregated ultrasonic scan
    use_scan_matching: true
    use_scan_barycenter: true
    mode: mapping

    # Timing
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 3.0        # Slower updates for ultrasonic
    resolution: 0.08                # Coarser resolution for ultrasonic
    max_laser_range: 3.5            # Limited by ultrasonic range
    minimum_time_interval: 0.3      # Match ultrasonic update rate
    transform_timeout: 0.5
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000

    # General Parameters
    use_sim_time: true
    
    # Correlation Parameters - Adjusted for sparse ultrasonic data
    correlative_scan_match_multi_resolution: true
    correlation_search_space_dimension: 0.3
    correlation_search_space_resolution: 0.02
    correlation_search_space_smear_deviation: 0.03

    # Loop Closure Parameters - More conservative for ultrasonic
    loop_search_maximum_distance: 2.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 8
    loop_match_maximum_variance_coarse: 1.5
    loop_match_minimum_response_coarse: 0.3
    loop_match_minimum_response_fine: 0.45

    # Scan Matcher Parameters - Tuned for sparse data
    distance_variance_penalty: 0.6
    angle_variance_penalty: 1.2
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
