slam_toolbox:
  ros__parameters:
    # Simulation time
    use_sim_time: true
    
    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters - CRITICAL: Uses EKF-fused odometry
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    use_map_saver: true
    mode: mapping

    # Optimized parameters for EKF-fused odometry
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 2.0
    resolution: 0.05
    max_laser_range: 12.0
    minimum_time_interval: 0.3       # Faster updates with stable EKF odom
    transform_timeout: 0.5           # Reduced - EKF provides stable TF
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    # Scan matching - optimized for IMU-fused odometry
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.2     # More frequent updates with stable odom
    minimum_travel_heading: 0.3      # Lower threshold - IMU provides accurate heading
    scan_buffer_size: 20
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.7
    link_scan_maximum_distance: 1.0
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 2.5
    loop_match_minimum_response_coarse: 0.65
    loop_match_minimum_response_fine: 0.75

    # Correlation Parameters - OPTIMISÉ pour rotation stable
    correlation_search_space_dimension: 0.3  # RÉDUIT: recherche plus locale
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.05  # RÉDUIT: moins de flou

    # Loop Closure Parameters
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan Matcher Parameters - OPTIMISÉ pour éviter téléportation
    distance_variance_penalty: 0.5      # Pénalité distance
    angle_variance_penalty: 2.0         # AUGMENTÉ: pénalise fortement erreurs rotation
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
