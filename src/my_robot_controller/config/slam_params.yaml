slam_toolbox:
  ros__parameters:
    # Simulation time
    use_sim_time: true
    
    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    odom_topic: /diff_cont/odom
    use_map_saver: true
    mode: mapping

    # Paramètres OPTIMISÉS POUR CARTE PARFAITE
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 1.0  # Mise à jour fréquente
    resolution: 0.03  # Résolution plus fine
    max_laser_range: 15.0
    minimum_laser_range: 0.15  # Doit être >= 0.15 pour ce LIDAR
    minimum_time_interval: 0.2
    transform_timeout: 0.3
    tf_buffer_duration: 60.
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    # General Parameters - OPTIMISÉ POUR NETTOYER LES ARTIFACTS
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.2  # Plus restrictif pour éviter les scans inutiles
    minimum_travel_heading: 0.2  # Plus restrictif
    scan_buffer_size: 10  # Réduit pour éviter les vieux scans
    scan_buffer_maximum_scan_distance: 12.0
    link_match_minimum_response_fine: 0.85  # Plus strict
    link_scan_maximum_distance: 0.25  # Plus strict pour éviter mauvais matches
    loop_search_maximum_distance: 1.5
    do_loop_closing: true  # Activé pour corriger les erreurs
    loop_match_minimum_chain_size: 30
    loop_match_maximum_variance_coarse: 0.8  # Plus strict
    loop_match_minimum_response_coarse: 0.85
    loop_match_minimum_response_fine: 0.92

    # Correlation Parameters - RÉDUCTION DES ARTIFACTS
    correlation_search_space_dimension: 0.25  # Plus restrictif
    correlation_search_space_resolution: 0.015  # Moins précis mais plus stable
    correlation_search_space_smear_deviation: 0.03  # Réduit le flou

    # Loop Closure Parameters - CONSERVATEUR
    loop_search_space_dimension: 4.0  # Plus petit
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan Matcher Parameters - STRICT
    distance_variance_penalty: 0.3  # Plus strict
    angle_variance_penalty: 0.5  # Plus strict
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
